<script>

}
function normPhone(v) { var d = String(v || '').replace(/\D/g, ''); if (d.length === 10 && d[0] === '0') return '+27' + d.slice(1); if (d.length === 11 && d.slice(0, 2) === '27') return '+' + d; return null; }

    if (!r.ok) { e.textContent = r.error || 'Could not send the code.'; e.hidden = false; this.disabled = false; this.textContent = 'Send me a code'; return; }
    phone = p; codeStep();
  };
}
function codeStep() {
  el('<div class="brand"><img src="icon-192.png" alt=""><b>Gate <span>Call</span></b></div><h1>Enter the code</h1><p>We sent a 6-digit code by SMS to ' + esc(showPhone(phone)) + '.</p>' +
    '<div class="card"><label>Code<input id="c" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="123456"></label><p class="err" id="e" hidden></p><button id="go">Sign in</button><button class="ghost" id="back">Change number</button></div>');
  $('back').onclick = signIn;
  $('go').onclick = async function () {

    try {

      try { var tv = await sb.from('app_config').select('value').eq('key', 'terms_version').maybeSingle(); await rpc('record_terms', { p_version: (tv.data && tv.data.value) || 'web', p_app: 'web' }); } catch (x) {}
      A = await rpc('my_account'); enter();
    } catch (x) { e.textContent = 'No internet connection. Try again.'; e.hidden = false; this.disabled = false; }
  };
}

function u8(b64) { var s = b64.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); }

    '<p>Your plan: <b style="color:var(--ink)">R' + Number(A.monthly || 49).toFixed(0) + ' per month</b>, paid by card through PayFast. Cancel any time.</p>' +
    '<p class="err" id="e" hidden></p><button id="go">Pay by card (PayFast)</button><button class="ghost" id="bk">Back</button></div>');
  $('bk').onclick = function () { location.hash = '#home'; };
  $('go').onclick = async function () { this.disabled = true; var r = await fn('pay', { action: 'subscribe' }).catch(function () { return { error: 'No internet connection.' }; }); if (r.url) { location.href = r.url; return; } $('e').textContent = r.error || 'Could not start the payment.'; $('e').hidden = false; this.disabled = false; };
}

/* ---------------- staying reachable ---------------- */
async function beat() { try { await rpc('heartbeat', { p_live: document.visibilityState === 'visible' }); } catch (e) {} }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && A) { beat(); loadVisits(); refreshPush(); } });
var chan = null;
function listen() {
  if (chan) return;
  chan = sb.channel('visits-' + A.id).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'visits', filter: 'account_id=eq.' + A.id }, function (p) {
    var v = p.new; if (v && v.status === 'ringing') ringUI({ visitId: v.id, gate: (A.gates[0] || {}).name || 'your gate' }); else loadVisits();
  }).subscribe();
}
// Opened from a call alert: is the visitor still waiting?
async function checkCall(id) { var r = await fn('call-app', { action: 'status', visitId: id }).catch(function () { return {}; }); if (r.status === 'ringing') ringUI({ visitId: id, gate: 'your gate' }); else loadVisits(); }
navigator.serviceWorker && navigator.serviceWorker.addEventListener('message', function (e) { var d = e.data || {}; if (d.type === 'call' && d.visitId) checkCall(d.visitId); });

/* ---------------- the call ---------------- */
var cur = null, tone = null, room = null, ringTimer = null, callTimer = null;
function startTone() {
  try {
    var C = window.AudioContext || window.webkitAudioContext, ctx = new C(), g = ctx.createGain(); g.gain.value = 0; g.connect(ctx.destination);
    [440, 480].forEach(function (f) { var o = ctx.createOscillator(); o.frequency.value = f; o.connect(g); o.start(); });
    var on = true, iv = setInterval(function () { g.gain.setTargetAtTime(on ? 0.15 : 0, ctx.currentTime, 0.02); on = !on; }, 1000);
    tone = { stop: function () { clearInterval(iv); try { ctx.close(); } catch (e) {} } };
    if (navigator.vibrate) navigator.vibrate([600, 400, 600, 400, 600]);
  } catch (e) {}
}
function stopTone() { if (tone) { tone.stop(); tone = null; } if (navigator.vibrate) navigator.vibrate(0); }
function ringUI(v) {
  if (cur) return; cur = v; startTone();
  var c = $('call'); c.className = 'show';
  c.innerHTML = '<div class="ring">🔔</div><h1>Visitor at ' + esc(v.gate) + '</h1><p>' + (v.test ? 'This is a test. It is how a visitor call looks and sounds.' : 'Someone is at your gate.') + '</p>' +
    '<div class="btns"><button class="green" id="an">📞 Answer</button>' +
    '<div class="quick row" style="gap:8px"><button class="ghost" data-r="Coming!">Coming!</button><button class="ghost" data-r="Please leave it at the gate">Leave it at the gate</button></div>' +
    '<button class="red" id="dc">Decline</button></div>';
  $('an').onclick = answer;
  $('dc').onclick = function () { decline(null); };
  c.querySelectorAll('[data-r]').forEach(function (b) { b.onclick = function () { decline(b.dataset.r); }; });
  clearTimeout(ringTimer); ringTimer = setTimeout(function () { if (cur && !room) endUI('Missed call'); }, 45000);
}
async function decline(reply) { var v = cur; stopTone(); if (v && v.visitId) await rpc('decline_visit', { p_visit: v.visitId, p_reply: reply }).catch(function () {}); endUI(reply ? 'Sent: ' + reply : 'Declined'); }
async function answer() {
  var v = cur; stopTone();
  if (v.test) return liveUI(v, null);
  $('an').disabled = true; $('an').textContent = 'Connecting…';
  var r = await fn('call-app', { action: 'answer', visitId: v.visitId }).catch(function () { return {}; });
  if (r.state !== 'live') return endUI('The visitor has left');
  await lk;
  if (!window.LivekitClient) return endUI('Could not connect the call');
  var LK = window.LivekitClient;
  room = new LK.Room({ adaptiveStream: false, dynacast: false });
  room.on(LK.RoomEvent.TrackSubscribed, function (track) {
    if (track.kind === 'audio') { var a = track.attach(); a.autoplay = true; $('audio').appendChild(a); }
    if (track.kind === 'video') { var vb = $('vid'); if (vb) { vb.hidden = false; track.attach(vb); } setVidState('on'); }
  });
  room.on(LK.RoomEvent.TrackUnsubscribed, function (track) { track.detach(); if (track.kind === 'video') { var vb = $('vid'); if (vb) vb.hidden = true; setVidState('ended'); } });
  room.on(LK.RoomEvent.DataReceived, function (data) { try { var m = JSON.parse(new TextDecoder().decode(data)); if (m.t === 'video-no') setVidState('no'); } catch (e) {} });
  room.on(LK.RoomEvent.ParticipantDisconnected, function () { endUI('Call ended'); });
  room.on(LK.RoomEvent.Disconnected, function () { endUI('Call ended'); });
  try { await room.connect(r.url, r.token); await room.localParticipant.setMicrophoneEnabled(true); room.startAudio && room.startAudio(); }
  catch (e) { return endUI('Could not connect the call. Check your internet.'); }
  liveUI(v, r.callLen);
}
function liveUI(v, len) {
  var c = $('call');
  c.innerHTML = '<h1>Talking to your visitor</h1><p id="tm">00:00</p><video id="vid" playsinline autoplay muted hidden></video><p id="vs" class="small"></p>' +
    '<div class="btns"><button id="vb">📷 See who\'s there</button><button class="red" id="hu">Hang up</button></div>';
  $('hu').onclick = function () { hangup(); };
  $('vb').onclick = askVideo;
  var t0 = Date.now(); clearInterval(callTimer);
  callTimer = setInterval(function () { var s = Math.floor((Date.now() - t0) / 1000); var m = $('tm'); if (m) m.textContent = String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); if (len && s >= len) hangup(); }, 500);
  if (v.test) setTimeout(function () { if (cur && cur.test) endUI('Test finished'); }, 8000);
}
function askVideo() {
  if (!room) { setVidState('test'); return; }
  room.localParticipant.publishData(new TextEncoder().encode(JSON.stringify({ t: 'video-req' })), { reliable: true });
  setVidState('asked');
}
function setVidState(s) {
  var p = $('vs'), b = $('vb'); if (!p) return;
  p.textContent = { asked: 'Asking the visitor to turn on their camera…', on: 'You can see your visitor (up to 60 seconds).', ended: 'Video ended. You are still talking.', no: 'The visitor did not turn on their camera.', test: 'In a real call, the visitor is asked to turn on their camera.' }[s] || '';
  if (b) b.hidden = s === 'asked' || s === 'on';
  if (s === 'ended' || s === 'no') { if (b) { b.hidden = false; b.textContent = '📷 Ask again'; } }
}
async function hangup() { var v = cur; if (v && v.visitId) await rpc('hangup_visit', { p_visit: v.visitId }).catch(function () {}); endUI('Call ended'); }
function endUI(msg) {
  stopTone(); clearTimeout(ringTimer); clearInterval(callTimer);
  if (room) { try { room.disconnect(); } catch (e) {} room = null; }
  $('audio').innerHTML = '';
  var c = $('call'); c.innerHTML = '<h1>' + esc(msg) + '</h1><button class="ghost" id="cl" style="max-width:420px">Close</button>';
  $('cl').onclick = function () { c.className = ''; cur = null; loadVisits(); };
  setTimeout(function () { if (c.querySelector('#cl')) { c.className = ''; cur = null; loadVisits(); } }, 4000);
}

start();
</script>
