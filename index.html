  button { font:inherit; font-weight:800; font-size:18px; border:0; border-radius:14px; padding:16px; cursor:pointer; background:var(--gold); color:var(--goldink); width:100%; }
  button.ghost { background:transparent; color:var(--ink); border:1px solid var(--line); font-weight:700; font-size:16px; }
  button.red { background:var(--red); color:#fff; }
  button:disabled { opacity:.45; cursor:default; }
  label { display:flex; flex-direction:column; gap:6px; color:var(--mut); font-size:14px; }
  input[type=text], input[type=tel], textarea { font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:13px; width:100%; }
  textarea { min-height:84px; resize:vertical; }
  input:focus, textarea:focus, button:focus-visible, select:focus { outline:2px solid var(--gold); outline-offset:2px; }
  .rec { color:var(--red); font-weight:700; font-size:14px; }
  .timer { font-size:44px; font-weight:800; text-align:center; letter-spacing:2px; }
  .pulse { width:84px; height:84px; border-radius:50%; background:var(--gold); margin:8px auto; animation:p 1.2s infinite ease-in-out; }
  @keyframes p { 0%,100% { transform:scale(.85); opacity:.6 } 50% { transform:scale(1.05); opacity:1 } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation:none } }

  .reply { color:var(--ink); font-size:20px; font-weight:700; }

  .err { color:var(--red); font-size:14px; }
  [hidden] { display:none !important; }

var qs = new URLSearchParams(location.search);
var PLATE = (qs.get('id') || '').toUpperCase().replace(/[^A-Z0-9_-]/g, '');
var L = pickLang();
function pickLang() {
  try { var s = localStorage.getItem('gc_lang'); if (s && T[s]) return s; } catch (e) {}
  var n = (navigator.languages || [navigator.language || 'en']).map(function (x) { return String(x).slice(0, 2).toLowerCase(); });
  for (var i = 0; i < n.length; i++) { if (T[n[i]]) return n[i]; if (n[i] === 'so') return 'st'; }
  return 'en';
}
function t(k) { return T[L][k] || T.en[k]; }
function callerId() {
  try { var k = localStorage.getItem('gc_caller'); if (!k) { k = (crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(36).slice(2) + Date.now().toString(36))); localStorage.setItem('gc_caller', k); } return k; }
  catch (e) { if (!window.__cid) window.__cid = 'anon' + Math.random().toString(36).slice(2) + Date.now().toString(36); return window.__cid; }
}
function api(action, body) {
  body = body || {}; body.action = action; body.callerId = callerId(); body.plate = PLATE;
  return fetch(SUPABASE_URL + '/functions/v1/visit', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY }, body: JSON.stringify(body) })
    .then(function (r) { return r.json(); });
}

var app = document.getElementById('app');
var timers = [], room = null, visit = null, screen = home, recordingOn = false;
function stop() { timers.forEach(function (x) { clearInterval(x); clearTimeout(x); }); timers = []; }
function every(ms, f) { var x = setInterval(f, ms); timers.push(x); return x; }
function after(ms, f) { var x = setTimeout(f, ms); timers.push(x); return x; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

}
function el(html, s) {
  if (s) screen = s;

function hangupRoom() { if (room) { try { room.disconnect(); } catch (e) {} room = null; } $('audio').innerHTML = ''; }

function home() {
  stop(); hangupRoom(); visit = null;
  if (!PLATE) return el('<h1>' + t('notSet') + '</h1><p>' + t('notSetBody') + '</p>', home);
  el('<h1>' + t('callTitle') + '</h1><p>' + t('callBody') + '</p><button id="call">' + t('callBtn') + '</button><p>' + t('someRec') + '</p>', home);

function problem() { stop(); hangupRoom(); el('<h1>' + t('oops') + '</h1><button id="again">' + t('again') + '</button>', problem); $('again').onclick = home; }

function ringing() {
  el('<h1>' + t('calling') + '</h1><div class="pulse" aria-hidden="true"></div><p style="text-align:center">' + t('waiting') + '</p><p style="text-align:center">' + t('mic') + '</p><button class="red" id="cancel">' + t('cancel') + '</button>', ringing);
  $('cancel').onclick = function () { var v = visit; stop(); hangupRoom(); if (v) api('end', { visitId: v.visitId, reason: 'cancel' }); home(); };
}

function start() {
  stop(); ringing();
  // Unlock audio on this tap (phones only play sound after a tap).
  var unlock = new (window.AudioContext || window.webkitAudioContext)(); unlock.resume && unlock.resume();
  api('call').then(function (r) {
    if (screen !== ringing) return;                        // visitor cancelled meanwhile
    if (r.state === 'notset') return el('<h1>' + t('notSet') + '</h1><p>' + t('notSetBody') + '</p>', home);
    if (r.state === 'blocked' || r.state === 'unavailable') return unavailable(r.state !== 'blocked', t('unBody'), r.visitId);
    if (r.state === 'limited') return unavailable(true, t('limited'));
    if (r.state !== 'ring') return problem();
    visit = r; recordingOn = !!r.recording;
    connect(r).catch(function () {});                     // join early so the call starts the moment they answer
    var waited = 0;
    every(1500, function () {
      waited += 1.5;
      if (r.escalateAfter && waited >= r.escalateAfter && !r._esc) { r._esc = true; api('escalate', { visitId: r.visitId }); }
      if (waited >= r.ringFor) { stop(); api('end', { visitId: r.visitId, reason: 'noanswer' }); hangupRoom(); return unavailable(true, t('noAnswer'), r.visitId); }
      api('status', { visitId: r.visitId }).then(function (s) {
        if (screen !== ringing) return;
        if (s.status === 'answered') return live(r);
        if (s.status === 'declined') { stop(); hangupRoom(); return declined(s.reply, r.visitId); }
        if (s.status === 'missed') { stop(); hangupRoom(); return unavailable(true, t('noAnswer'), r.visitId); }
      }).catch(function () {});
    });
  }).catch(problem);
}

function connect(r) {
  if (!window.LivekitClient || !r.url || !r.token) return Promise.reject();
  var LK = window.LivekitClient;
  room = new LK.Room({ adaptiveStream: false, dynacast: false });
  room.on(LK.RoomEvent.TrackSubscribed, function (track) {
    if (track.kind === 'audio') { var a = track.attach(); a.autoplay = true; $('audio').appendChild(a); }
  });
  room.on(LK.RoomEvent.ParticipantDisconnected, function () { if (screen === live) ended(); });
  return room.connect(r.url, r.token).then(function () { return room.localParticipant.setMicrophoneEnabled(true); }).then(function () { return room.startAudio(); });
}

function live(r) {
  stop();
  var left = r.callLen || 0, up = 0;
  el('<h1>' + t('connected') + '</h1>' + (recordingOn ? '<p class="rec">● ' + t('recNow') + '</p>' : '') +
     '<div class="timer" id="clock"></div><p style="text-align:center">' + t('speak') + '</p><button class="red" id="hang">' + t('hang') + '</button>', live);
  if (room) room.startAudio().catch(function () {});
  function draw() { var s = left ? Math.max(0, left - up) : up; $('clock').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
  draw();
  every(1000, function () { up++; draw(); if (left && up >= left) ended(); });
  $('hang').onclick = ended;
}

  var v = visit; stop(); hangupRoom();

  stop(); hangupRoom();

  $('done').onclick = home;

function shrink(file) {   // photo -> small JPEG data URL (max 640 px), so it uploads fast on mobile data
  return new Promise(function (res) {
    if (!file) return res(null);
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var s = Math.min(1, 640 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function () { res(null); };
    img.src = url;
  });
}

function form(visitId) {
  stop();
  el('<h1>' + t('msgTitle') + '</h1><form class="card" id="f" novalidate>' +
    '<label>' + t('name') + '<input type="text" id="name" maxlength="60" autocomplete="name" required></label>' +
    '<label>' + t('reason') + '<textarea id="reason" maxlength="300"></textarea></label>' +
    '<label>' + t('phone') + '<input type="tel" id="phone" inputmode="tel" autocomplete="tel" maxlength="20"></label>' +
    '<label>' + t('photo') + '<input type="file" id="photo" accept="image/*" capture="user"></label>' +
    '<p class="err" id="err" hidden></p><button type="submit" id="send">' + t('send') + '</button></form>', function () { form(visitId); });
  $('f').onsubmit = function (e) {
    e.preventDefault();
    var name = $('name').value.trim(), err = $('err');
    if (!name) { err.textContent = t('needName'); err.hidden = false; $('name').focus(); return; }
    $('send').disabled = true;
    shrink($('photo').files[0]).then(function (photo) {
      return api('message', { visitId: visitId || null, name: name, reason: $('reason').value.trim(), phone: $('phone').value.trim(), photo: photo });
    }).then(function (r) {
      if (!r || r.error) { err.textContent = t('oops'); err.hidden = false; $('send').disabled = false; return; }
      el('<h1>' + t('sent') + '</h1>' + salesBanner() + '<button class="ghost" id="back">' + t('back') + '</button>', home);
      wireSales(); $('back').onclick = home;
    }).catch(function () { err.textContent = t('oops'); err.hidden = false; $('send').disabled = false; });
  };
}

function salesBanner() {
  return '<div class="card sales"><b>' + t('salesText') + '</b><p>' + t('salesBody') + '</p><button class="ghost" id="order">' + t('salesBtn') + '</button><p class="err" id="ordermsg" hidden>' + t('soon') + '</p></div>';
}
function wireSales() {
  var b = $('order'); if (!b) return;
  b.onclick = function () { if (SALES_URL) window.open(SALES_URL, '_blank', 'noopener'); else $('ordermsg').hidden = false; };
}

window.addEventListener('pagehide', function () { if (visit && screen === ringing) navigator.sendBeacon && api('end', { visitId: visit.visitId, reason: 'cancel' }); });

callerId();
if (!PLATE) home();
else api('open').then(function (r) {
  if (r.state === 'notset') return el('<h1>' + t('notSet') + '</h1><p>' + t('notSetBody') + '</p>', home);
  if (r.state === 'blocked') return unavailable(false);
  home();
}).catch(home);
</script>
</body>
</html>
